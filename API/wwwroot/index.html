<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLCSim Advanced Web Manager</title>
    <style>
        :root {
            --primary: #005f87;
            --background: #f4f7f6;
            --surface: #ffffff;
            --text: #333333;
            --border: #dddddd;
            --danger: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

            button:hover {
                opacity: 0.9;
            }

        .btn-danger {
            background-color: var(--danger);
            width: auto;
            padding: 5px 10px;
            font-size: 0.9em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--background);
            color: var(--primary);
        }

        .hidden {
            display: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Izquierdo: Crear Instancia -->
        <div class="card">
            <h2>Crear Nueva Instancia</h2>
            <form id="createForm">
                <div class="form-group">
                    <label for="plcName">Nombre de la Instancia:</label>
                    <input type="text" id="plcName" required placeholder="Ej: PLC_1">
                </div>

                <div class="form-group">
                    <label for="networkType">Tipo de Red:</label>
                    <select id="networkType" onchange="toggleNetworkFields()">
                        <option value="Softbus">Softbus</option>
                        <option value="TCPIP">TCP/IP</option>
                    </select>
                </div>

                <!-- Estos campos se ocultan si es Softbus -->
                <div id="tcpFields" class="hidden">
                    <div class="form-group">
                        <label for="ipAddress">Dirección IP:</label>
                        <input type="text" id="ipAddress" placeholder="Ej: 192.168.0.1">
                    </div>
                    <div class="form-group">
                        <label for="subnetMask">Máscara de Subred:</label>
                        <input type="text" id="subnetMask" placeholder="Ej: 255.255.255.0">
                    </div>
                    <div class="form-group">
                        <label for="gateway">Puerta de Enlace (Gateway):</label>
                        <input type="text" id="gateway" placeholder="Ej: 192.168.0.254">
                    </div>
                </div>

                <button type="submit">Iniciar PLC</button>
                <div id="formStatus" class="status-msg"></div>
            </form>
        </div>

        <!-- Panel Derecho: Lista de Instancias -->
        <div class="card">
            <h2>Instancias Activas</h2>
            <button onclick="loadInstances()" style="width: auto; margin-bottom: 10px;">↻ Refrescar Lista</button>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Tipo CPU</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="instancesTableBody">
                    <tr><td colspan="4">Cargando instancias...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- UI Lógica ---
        function toggleNetworkFields() {
            const networkType = document.getElementById('networkType').value;
            const tcpFields = document.getElementById('tcpFields');
            if (networkType === 'TCPIP') {
                tcpFields.classList.remove('hidden');
            } else {
                tcpFields.classList.add('hidden');
            }
        }

        // --- API Lógica ---
        const apiUrl = '/api/plc/instances';

        // 1. Cargar lista de instancias
        async function loadInstances() {
            const tbody = document.getElementById('instancesTableBody');
            tbody.innerHTML = '<tr><td colspan="4">Cargando instancias...</td></tr>';

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Error al conectar con la API');

                const data = await response.json();

                tbody.innerHTML = ''; // Limpiar tabla

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No hay instancias activas.</td></tr>';
                    return;
                }

                data.forEach(instance => {
                    const row = `<tr>
                            <td><strong>${instance.Name}</strong></td>
                            <td>${instance.State}</td>
                            <td>${instance.CpuType}</td>
                            <td>
                                <button class="btn-danger" onclick="deleteInstance('${instance.Name}')">Eliminar</button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" style="color: red;">Error: ${error.message}</td></tr>`;
            }
        }

        // 2. Crear instancia
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar que la página recargue

            const statusDiv = document.getElementById('formStatus');
            statusDiv.textContent = 'Creando instancia...';
            statusDiv.style.color = 'var(--text)';

            const payload = {
                Name: document.getElementById('plcName').value,
                NetworkType: document.getElementById('networkType').value,
                IpAddress: document.getElementById('ipAddress').value,
                SubnetMask: document.getElementById('subnetMask').value,
                Gateway: document.getElementById('gateway').value
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusDiv.textContent = '¡Instancia creada correctamente!';
                    statusDiv.style.color = 'green';
                    document.getElementById('createForm').reset();
                    toggleNetworkFields(); // Asegurar que se ocultan los campos IP
                    loadInstances(); // Recargar la tabla
                } else {
                    const errorData = await response.json();
                    statusDiv.textContent = 'Error: ' + (errorData.Message || 'Fallo desconocido');
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                console.error(error);
                statusDiv.textContent = 'Error de conexión con el servidor.';
                statusDiv.style.color = 'red';
            }
        });

        // 3. Eliminar instancia
        async function deleteInstance(name) {
            if (!confirm(`¿Estás seguro de que deseas apagar y eliminar la instancia '${name}'?`)) {
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/${name}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert(`Instancia '${name}' eliminada con éxito.`);
                    loadInstances(); // Recargar la tabla
                } else {
                    const errorData = await response.json();
                    alert('Error al eliminar: ' + (errorData.Message || 'Desconocido'));
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión con el servidor.');
            }
        }

        // Cargar las instancias al abrir la página
        window.onload = loadInstances;
    </script>
</body>
</html>
